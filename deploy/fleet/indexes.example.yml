# The indexes served by this host.
#
# Each entry becomes one brain, reachable at <public_base_url>/<name>/mcp with
# an explorer UI at <public_base_url>/<name>/ui.
# They share a single OpenSearch cluster (one index per brain), which is what
# makes adding an index cheap: a ~250MB container, not another cluster.
#
# After editing, run:  ./fleet.py up

# Where agents reach this host — the load balancer's address once one is in
# front, not the VM's. Caddy obtains a Let's Encrypt certificate for this name,
# so it must resolve here; a bare IP cannot hold a certificate. With no DNS,
# nip.io is the shortcut: <ip>.nip.io resolves to <ip>.
#   https://203.0.113.10.nip.io     no DNS needed
#   https://index.example.com       your own record
public_base_url: https://localhost

# Host directory holding one subdirectory per brain.
brains_root: ./brains

# Caddy publishes 80 (ACME challenge + redirect) and 443. A load balancer in
# front should forward both, or terminate TLS itself and forward 80.
http_port: 80

# A bearer token per MCP endpoint and a password per UI, generated on first run
# and scoped so one index's credentials never open another's. Only set this to
# false when the data is genuinely public — it also opens the write tools.
auth: true

# Heap for the shared OpenSearch container. Keep total under the box's RAM:
# roughly opensearch_heap * 2 + 330MB per index (brain + ui) + 500MB for the OS.
opensearch_heap: 512m

indexes:
  - name: support
    description: Customer support knowledge — products, issues, segments.

  - name: sales
    description: Sales pipeline — accounts, deals, contacts.

  # read_only exposes search/get/navigation but no write tools. Useful for an
  # index that agents should consult but never modify.
  # ui: false drops the explorer container for this index (~71MB) when nobody
  # needs to browse it by hand.
  # - name: policies
  #   description: Company policies, reference only.
  #   read_only: true
  #   ui: false
