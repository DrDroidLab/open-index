# The indexes served by this host.
#
# Each entry becomes one brain, reachable at <public_base_url>/<name>/mcp with
# an explorer UI at <public_base_url>/<name>/ui.
# They share a single OpenSearch cluster (one index per brain), which is what
# makes adding an index cheap: a ~250MB container, not another cluster.
#
# After editing, run:  ./fleet.py up

# Where agents will reach this host. Used for the connection details printed by
# `fleet.py tokens` and by each container's startup banner — set it to the load
# balancer's address, not the VM's, once the LB is in front.
# nip.io resolves <ip>.nip.io to <ip>, which gives Caddy a real hostname to
# obtain a Let's Encrypt certificate for — a bare IP cannot have one.
public_base_url: https://20.83.97.30.nip.io

# Host directory holding one subdirectory per brain.
brains_root: /home/azureuser/brains

# Caddy publishes 80 (ACME challenge + redirect) and 443. A load balancer in
# front should forward both, or terminate TLS itself and forward 80.
http_port: 80

# These indexes hold synthetic demo data and are deliberately open: no bearer
# token on the MCP endpoints, no password on the UIs. Set true to gate both.
auth: false

# Heap for the shared OpenSearch container. Keep total under the box's RAM:
# roughly opensearch_heap * 2 + 330MB per index (brain + ui) + 500MB for the OS.
opensearch_heap: 512m

indexes:
  - name: aviation-mro-index
    description: >-
      Line and base maintenance for a narrowbody fleet — ATA taxonomy, fault
      messages, task cards, MEL entries and defect history. SYNTHETIC DEMO DATA.

  - name: commercial-lines-index
    description: >-
      Commercial-lines placement for an SMB brokerage — carriers, appetite
      rules, class codes, state rules and submission playbooks. SYNTHETIC DEMO DATA.

  # read_only exposes search/get/navigation but no write tools. Useful for an
  # index that agents should consult but never modify.
  # ui: false drops the explorer container for this index (~71MB) when nobody
  # needs to browse it by hand.
  # - name: policies
  #   description: Company policies, reference only.
  #   read_only: true
  #   ui: false
