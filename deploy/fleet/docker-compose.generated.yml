# GENERATED BY fleet.py — do not edit. Change indexes.yml and re-run `fleet.py up`.
#
# One shared OpenSearch cluster, one brain container per index, one Caddy in
# front doing path routing and TLS.

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    container_name: oi-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.routing.allocation.disk.threshold_enabled=false
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # Loopback only — the brains reach it over the compose network.
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # support — Customer support knowledge — products, issues, segments.
  brain-support:
    image: open-index:local
    build:
      context: ../..
      args:
        EXTRAS: serve,opensearch,ui,semantic
    container_name: oi-brain-support
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      OPEN_INDEX_TOKEN: ${OPEN_INDEX_TOKEN_SUPPORT}
      OPEN_INDEX_SEARCH_BACKEND: opensearch
      OPEN_INDEX_OPENSEARCH_HOSTS: http://opensearch:9200
      # One cluster index per brain — this is what lets them share a cluster.
      OPEN_INDEX_OPENSEARCH_INDEX: open_index_support
      # What the startup banner and `mcp-config` advertise, including the path
      # prefix nginx serves this brain on.
      OPEN_INDEX_PUBLIC_URL: https://20.83.97.30.nip.io/support/mcp
      OPEN_INDEX_EMBEDDING_CACHE: /home/openindex/model-cache
    volumes:
      - ./brains/support:/brain
      - model-cache:/home/openindex/model-cache
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
  ui-support:
    image: open-index:local
    container_name: oi-ui-support
    command: ["ui", "--port", "8501"]
    environment:
      OPEN_INDEX_SEARCH_BACKEND: opensearch
      OPEN_INDEX_OPENSEARCH_HOSTS: http://opensearch:9200
      OPEN_INDEX_OPENSEARCH_INDEX: open_index_support
      OPEN_INDEX_EMBEDDING_CACHE: /home/openindex/model-cache
      # Streamlit must know it lives under a path prefix, or every asset and the
      # websocket resolve to / and the page loads blank behind the proxy.
      OPEN_INDEX_PUBLIC_URL: https://20.83.97.30.nip.io/support/mcp
      OPEN_INDEX_READ_ONLY: "false"
      STREAMLIT_SERVER_BASE_URL_PATH: support/ui
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      # The browser's Origin is the proxy's, not Streamlit's; its XSRF check
      # rejects that and the session never connects.
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - ./brains/support:/brain
      - model-cache:/home/openindex/model-cache
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
  # sales — Sales pipeline — accounts, deals, contacts.
  brain-sales:
    image: open-index:local
    build:
      context: ../..
      args:
        EXTRAS: serve,opensearch,ui,semantic
    container_name: oi-brain-sales
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      OPEN_INDEX_TOKEN: ${OPEN_INDEX_TOKEN_SALES}
      OPEN_INDEX_SEARCH_BACKEND: opensearch
      OPEN_INDEX_OPENSEARCH_HOSTS: http://opensearch:9200
      # One cluster index per brain — this is what lets them share a cluster.
      OPEN_INDEX_OPENSEARCH_INDEX: open_index_sales
      # What the startup banner and `mcp-config` advertise, including the path
      # prefix nginx serves this brain on.
      OPEN_INDEX_PUBLIC_URL: https://20.83.97.30.nip.io/sales/mcp
      OPEN_INDEX_EMBEDDING_CACHE: /home/openindex/model-cache
    volumes:
      - ./brains/sales:/brain
      - model-cache:/home/openindex/model-cache
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
  ui-sales:
    image: open-index:local
    container_name: oi-ui-sales
    command: ["ui", "--port", "8501"]
    environment:
      OPEN_INDEX_SEARCH_BACKEND: opensearch
      OPEN_INDEX_OPENSEARCH_HOSTS: http://opensearch:9200
      OPEN_INDEX_OPENSEARCH_INDEX: open_index_sales
      OPEN_INDEX_EMBEDDING_CACHE: /home/openindex/model-cache
      # Streamlit must know it lives under a path prefix, or every asset and the
      # websocket resolve to / and the page loads blank behind the proxy.
      OPEN_INDEX_PUBLIC_URL: https://20.83.97.30.nip.io/sales/mcp
      OPEN_INDEX_READ_ONLY: "false"
      STREAMLIT_SERVER_BASE_URL_PATH: sales/ui
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      # The browser's Origin is the proxy's, not Streamlit's; its XSRF check
      # rejects that and the session never connects.
      STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION: "false"
      STREAMLIT_SERVER_ENABLE_CORS: "false"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - ./brains/sales:/brain
      - model-cache:/home/openindex/model-cache
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: oi-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account state. Losing this means re-issuing on
      # every restart, which will hit Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"      # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443"
    environment:
      UI_HASH_SUPPORT: ${UI_HASH_SUPPORT}
      UI_HASH_SALES: ${UI_HASH_SALES}
    depends_on:
      - brain-support
      - ui-support
      - brain-sales
      - ui-sales
    restart: unless-stopped

volumes:
  opensearch-data:
  model-cache:
  caddy-data:
  caddy-config:
