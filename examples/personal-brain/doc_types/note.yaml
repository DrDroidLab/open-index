doc_type: note
description: A journal / reflection entry. Kept as files here; for a high-volume journal that an agent appends to after sessions, switch storage to index.
storage: file
display:
  label_field: name
  color: "#6b7280"
schema:
  fields:
    - { name: name,        type: string, processing: keyword, search: syntactic, boost: 4 }
    - { name: body,        type: text,   processing: text,    search: semantic, boost: 2 }
    - { name: date,        type: string, processing: timestamp, search: none }
relationships:
  - { name: "reflects on", target_doc_type: goal }
