doc_type: user_segment
description: A category of users (by plan, industry, or behavior).
storage: file   # curated — JSON files under entities/ are the source of truth
display:
  label_field: name
  color: "#059669"
schema:
  fields:
    - { name: name,        type: string, processing: keyword, search: syntactic, boost: 6 }
    - { name: description, type: text,   processing: text,    search: semantic }
    - { name: size,        type: number, processing: keyword, search: none }
relationships:
  - { name: "frequently reports", target_doc_type: issue }
