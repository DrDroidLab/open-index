doc_type: comment
description: A notable customer comment or piece of feedback.
storage: file   # curated — JSON files under entities/ are the source of truth
display:
  label_field: name
  color: "#0284c7"
schema:
  fields:
    - { name: name,        type: string, processing: keyword, search: syntactic, boost: 4 }
    - { name: body,        type: text,   processing: text,    search: semantic, boost: 2 }
    - { name: author,      type: string, processing: keyword, search: syntactic }
    - { name: sentiment,   type: string, processing: keyword, search: syntactic }
relationships:
  - { name: "is evidence for", target_doc_type: issue }
  - { name: "came from",       target_doc_type: user_segment }
