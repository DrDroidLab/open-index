doc_type: datastore
description: A database, cache, or queue that services depend on (DrDroid's infra_component / datastore category).
storage: file
display:
  label_field: name
  color: "#059669"
schema:
  fields:
    - { name: name,        type: string, processing: keyword, search: syntactic, boost: 6 }
    - { name: description, type: text,   processing: text,    search: semantic }
    - { name: engine,      type: string, processing: keyword, search: syntactic, boost: 2 }
    - { name: tier,        type: string, processing: keyword, search: syntactic }
relationships:
  - { name: "is documented by", target_doc_type: runbook }
