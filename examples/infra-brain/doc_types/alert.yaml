doc_type: alert
description: An alert rule / firing signal on a service (DrDroid's alert_rule). Temporal and high-volume, so index-backed — pulled by a connector, not tracked in git.
storage: index
display:
  label_field: name
  color: "#dc2626"
schema:
  fields:
    - { name: name,        type: string, processing: keyword, search: syntactic, boost: 6 }
    - { name: description, type: text,   processing: text,    search: semantic }
    - { name: severity,    type: string, processing: keyword, search: syntactic, boost: 2 }
    - { name: status,      type: string, processing: keyword, search: syntactic }
relationships:
  - { name: "fires on", target_doc_type: service }
