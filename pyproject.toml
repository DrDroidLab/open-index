[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-index"
version = "0.1.0"
description = "Build and query a continuously-improving, domain-agnostic context graph about your company."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.36",
    "streamlit-agraph>=0.0.45",
]
mcp = [
    "mcp>=1.2",
]
# Production: OpenSearch backend for a shared, networked, multi-writer brain.
opensearch = [
    "opensearch-py>=2.4",
]
# Deployable HTTP MCP endpoint (open-index serve).
serve = [
    "mcp>=1.2",
    "uvicorn>=0.30",
    "starlette>=1.0",
]
# Semantic/vector search (local ONNX model + OpenAI-compatible API support).
semantic = [
    "fastembed>=0.3",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
]
all = [
    "streamlit>=1.36",
    "streamlit-agraph>=0.0.45",
    "mcp>=1.2",
    "opensearch-py>=2.4",
    "uvicorn>=0.30",
    "starlette>=1.0",
    "fastembed>=0.3",
    "numpy>=1.26",
    "pytest>=8.0",
]

[project.scripts]
open-index = "open_index.cli:app"

[tool.setuptools.packages.find]
include = ["open_index*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
