[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "droid-brain"
version = "0.1.0"
description = "Build and maintain organisational knowledge (doc_types, entities) as a local brain, and serve it to any LLM over MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32",
    "mcp>=2.0",
    "uvicorn>=0.30",  # serves `droid-brain mcp --http`
]

[project.urls]
Homepage = "https://github.com/DrDroidLab/droid-brain"

[project.scripts]
droid-brain = "droid_brain.cli:main"

[tool.setuptools.packages.find]
include = ["droid_brain*"]
